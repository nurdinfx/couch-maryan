<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="gsBgGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="gsBorderGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Monogram 'G' Gradient -->
    <linearGradient id="gLetterGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Monogram 'S' Gradient -->
    <linearGradient id="sLetterGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gsCapGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Text Primary Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Filter for Shadow -->
    <filter id="gsShadowL" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Icon Emblem Group -->
  <g transform="translate(6, 7)">
    <!-- Base Rounded Squircle with Shadow -->
    <rect x="2" y="2" width="92" height="92" rx="24" ry="24" fill="url(#gsBgGradL)" stroke="url(#gsBorderGradL)" stroke-width="2" filter="url(#gsShadowL)" />
    <!-- Ambient glow circle -->
    <circle cx="34" cy="28" r="32" fill="#38bdf8" opacity="0.14" />

    <!-- Academic Graduation Cap Emblem -->
    <g transform="translate(48, 20)">
      <polygon points="0,-10 18,-3 0,4 -18,-3" fill="url(#gsCapGradL)" />
      <path d="M-11,-1 C-11,5 11,5 11,-1" fill="#b45309" opacity="0.8" />
      <path d="M13,-1 C16,3 17,7 16,10" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="16" cy="11" r="1.5" fill="#fde047" />
    </g>

    <!-- Monogram letters -->
    <g transform="translate(6, 6) scale(0.76)">
      <!-- Letter G -->
      <path d="M 52,44 C 42,44 32,50 28,58 C 22,68 22,82 30,92 C 38,102 52,104 64,101 C 74,98 80,90 82,82 L 57,82 L 57,72 L 93,72 C 93,86 85,102 68,110 C 48,118 26,113 14,97 C 2,81 3,60 13,44 C 24,28 42,22 60,24 L 56,36 C 46,35 38,38 34,44 Z" fill="url(#gLetterGradL)" opacity="0.95" />
      <!-- Letter S -->
      <path d="M 84,42 C 80,36 71,32 60,33 C 52,34 46,38 46,44 C 46,50 52,54 62,57 C 78,61 94,66 94,82 C 94,96 82,106 66,106 C 54,106 44,101 38,94 L 46,84 C 50,90 58,94 67,94 C 74,94 80,90 80,84 C 80,78 72,74 62,70 C 48,65 33,59 33,45 C 33,31 46,21 62,21 C 72,21 82,25 90,32 Z" fill="url(#sLetterGradL)" />
    </g>
  </g>

  <!-- Typography Right Column -->
  <g transform="translate(118, 0)">
    <!-- Main Title: GURAY SICID -->
    <text x="0" y="44" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="1.2">
      GURAY SICID
    </text>

    <!-- Sub-heading: LEARNING PLATFORM -->
    <text x="0" y="69" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#2563eb" letter-spacing="3.5">
      LEARNING PLATFORM
    </text>

    <!-- Tagline: Learning Without Limit -->
    <g transform="translate(0, 89)">
      <!-- Small decorative accent line -->
      <line x1="0" y1="-5" x2="32" y2="-5" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
      <text x="40" y="-1" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#64748b" letter-spacing="1">
        LEARNING WITHOUT LIMIT
      </text>
    </g>
  </g>
</svg>
