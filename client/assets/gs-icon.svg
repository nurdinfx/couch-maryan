<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="gsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#1d2d5b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="gsBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Monogram 'G' Gradient -->
    <linearGradient id="gLetterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Monogram 'S' Gradient -->
    <linearGradient id="sLetterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gsCapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="gsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Shadow -->
  <rect x="4" y="4" width="120" height="120" rx="30" ry="30" fill="url(#gsBgGrad)" stroke="url(#gsBorderGrad)" stroke-width="2.5" filter="url(#gsGlow)" />

  <!-- Inner Subtle Ambient Radial Highlight -->
  <circle cx="44" cy="36" r="42" fill="#38bdf8" opacity="0.12" />

  <!-- Academic Graduation Cap Emblem atop Monogram -->
  <g id="grad-cap" transform="translate(64, 26)">
    <!-- Cap Diamond -->
    <polygon points="0,-12 22,-4 0,4 -22,-4" fill="url(#gsCapGrad)" />
    <!-- Cap Skull Cap Underneath -->
    <path d="M-13,-1 C-13,6 13,6 13,-1" fill="#b45309" opacity="0.8" />
    <!-- Tassel String and Ribbon -->
    <path d="M16,-2 C20,3 21,9 20,13" fill="none" stroke="#fef08a" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="20" cy="14" r="2" fill="#fde047" />
  </g>

  <!-- Interlocking GS Monogram -->
  <g transform="translate(10, 8)">
    <!-- Letter G (Dynamic bold stylized curve) -->
    <path d="M 52,44 
             C 42,44 32,50 28,58 
             C 22,68 22,82 30,92 
             C 38,102 52,104 64,101 
             C 74,98 80,90 82,82 
             L 57,82 
             L 57,72 
             L 93,72 
             C 93,86 85,102 68,110 
             C 48,118 26,113 14,97 
             C 2,81 3,60 13,44 
             C 24,28 42,22 60,24 
             L 56,36 
             C 46,35 38,38 34,44 Z" 
          fill="url(#gLetterGrad)" opacity="0.95" />

    <!-- Letter S (Sleek interlocking dynamic wave in gold) -->
    <path d="M 84,42 
             C 80,36 71,32 60,33 
             C 52,34 46,38 46,44 
             C 46,50 52,54 62,57 
             C 78,61 94,66 94,82 
             C 94,96 82,106 66,106 
             C 54,106 44,101 38,94 
             L 46,84 
             C 50,90 58,94 67,94 
             C 74,94 80,90 80,84 
             C 80,78 72,74 62,70 
             C 48,65 33,59 33,45 
             C 33,31 46,21 62,21 
             C 72,21 82,25 90,32 Z" 
          fill="url(#sLetterGrad)" />
  </g>

  <!-- Bottom Accent Sparkle Star -->
  <polygon points="104,26 106,30 110,32 106,34 104,38 102,34 98,32 102,30" fill="#fde047" opacity="0.9" />
</svg>
